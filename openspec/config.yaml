schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Universal Expo app (SDK 57) written in TypeScript with strict mode.
  Navigation: Expo Router (file-based, screens in src/app/).
  Native UI: @expo/ui universal components (SwiftUI on iOS, Jetpack Compose on
  Android, React Native fallback on web). Prefer the universal entry point
  `@expo/ui` over the platform-specific `@expo/ui/swift-ui` and
  `@expo/ui/jetpack-compose` unless a platform-only component is needed.
  Path alias: `@/` -> src/, `@/assets/` -> assets/.
  Styling: StyleSheet plus the theme tokens in src/constants/theme.ts.
  Targets: iOS, Android, and web.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
