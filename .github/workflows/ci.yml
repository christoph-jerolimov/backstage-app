name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    name: Typecheck, lint, test, web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test -- --ci

      - name: Export web bundle
        run: npx expo export --platform web
        working-directory: packages/app

      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: packages/app/dist
          retention-days: 7

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    env:
      # The default 2 GB Gradle heap plus the Kotlin daemon and clang for the
      # native modules exhausted the hosted runner, which then died silently.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /
          free -m

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        working-directory: packages/app

      - name: Build debug APK
        # CI only needs one ABI; building all four multiplies the native
        # compile work and was the main cost of this job.
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
        working-directory: packages/app/android

      - uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: packages/app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    needs: check
    # Temporarily disabled to save macOS runner time; flip to `true` to re-enable.
    if: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native project and install pods
        run: npx expo prebuild --platform ios
        working-directory: packages/app

      - name: Build for iOS Simulator
        working-directory: packages/app
        run: |
          xcodebuild \
            -workspace ios/BackstageApp.xcworkspace \
            -scheme BackstageApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
